name: HEX loader

on:
  pull_request:
    paths:
      - pxtlib/**
      - tests/hexloader-test/**
      - gulpfile.js
      - package.json
      - .github/workflows/hexloader-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: |
          mkdir -p built
          cp pxtcompiler/ext-typescript/lib/typescriptServices.d.ts built/
          for project in pxtlib pxtcompiler pxtsim pxtpy; do
            node node_modules/typescript/bin/tsc -p "$project"
          done
      - run: node node_modules/gulp/bin/gulp.js testhexloader
      - run: node node_modules/eslint/bin/eslint.js pxtlib/cpp.ts
      - run: node node_modules/eslint/bin/eslint.js tests/hexloader-test/hexrunner.ts --parser-options '{"project":"tests/hexloader-test/tsconfig.json"}'
